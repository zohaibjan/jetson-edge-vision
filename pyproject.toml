[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "jetson-edge-vision"
version = "0.1.0"
description = "Jetson YOLO reference plugins and a ZeroMQ/WebSocket detection dashboard"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pyzmq>=26,<28", "pydantic>=2.10,<3", "websockets>=13,<17"]
[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
[project.scripts]
edge-vision = "edgevision.cli:main"
edge-simulate = "edgevision.simulator:main"
[tool.setuptools.packages.find]
where = ["python"]
[tool.setuptools.package-data]
edgevision = ["static/*"]
[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["tests"]
